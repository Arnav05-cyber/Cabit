version: '3.8'

services:
  # --- INFRASTRUCTURE ---
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cabit
    ports:
      - "3306:3306"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # Kafka (using KRaft mode - no Zookeeper needed)
  kafka:
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

  # --- KONG GATEWAY ---
  kong:
    image: kong:latest
    environment:
      KONG_DATABASE: "off" # We'll use declarative config (dbless)
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000" # Public API Port
      - "8001:8001" # Admin Port
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml

  # --- CABIT MICROSERVICES ---
  auth-service:
    build: 
      context: ./authService
    image: authService-cabit
    ports:
      - "8081:8081"
    depends_on:
      - mysql

  user-service:
    build: 
      context: ./userService
    image: userService-cabit
    ports:
      - "8083:8083"
    depends_on:
      - mysql

  ride-service:
    build: 
      context: ./rideService
    image: rideService-cabit
    ports:
      - "8082:8082"
    depends_on:
      - mysql
      - redis
      - kafka

  notification-service:
    build: 
      context: ./notificationservice
    image: notificationservice-cabit
    ports:
      - "8084:8084"
    depends_on:
      - kafka