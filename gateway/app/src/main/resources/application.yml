spring:
  application:
    name: gateway

  # ===============================
  # Redis (for Rate Limiter)
  # ===============================
  data:
    redis:
      host: redis
      port: 6379

  # ===============================
  # Cloud Gateway Routes
  # ===============================
  cloud:
    gateway:
      # Global default filters applied to ALL routes
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20    # tokens added per second
            redis-rate-limiter.burstCapacity: 40    # max burst
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"

      routes:
        # -------------------------------------------------
        # AUTH SERVICE — no JWT required (public endpoints)
        # -------------------------------------------------
        - id: auth-signup
          uri: http://auth-service:9820
          predicates:
            - Path=/auth/v1/signup
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"

        - id: auth-login
          uri: http://auth-service:9820
          predicates:
            - Path=/auth/v1/login
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"

        - id: auth-google
          uri: http://auth-service:9820
          predicates:
            - Path=/auth/v1/google
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"

        - id: auth-refresh
          uri: http://auth-service:9820
          predicates:
            - Path=/auth/v1/refreshToken

        # -------------------------------------------------
        # RIDE SERVICE — JWT required
        # -------------------------------------------------
        - id: ride-service
          uri: http://ride-service:8080
          predicates:
            - Path=/v1/ride/**
          filters:
            - JwtAuthFilter

        - id: rides-route
          uri: http://ride-service:8080
          predicates:
            - Path=/rides/**
          filters:
            - JwtAuthFilter

        # -------------------------------------------------
        # USER SERVICE — JWT required
        # -------------------------------------------------
        - id: user-service
          uri: http://user-service:9810
          predicates:
            - Path=/user/**
          filters:
            - JwtAuthFilter

# ===============================
# Server
# ===============================
server:
  port: 8080

# ===============================
# JWT (shared secret — must match auth-service)
# ===============================
jwt:
  secret: mySecretKey12345678901234567890123456789012345678901234567890

# ===============================
# Zipkin
# ===============================
management:
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway

# ===============================
# Logging
# ===============================
logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty: INFO
