spring.application.name=auth-service

# ===============================
# MySQL Configuration
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://mysql:3306/authservice
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# Server
# ===============================
server.port=9820

# ===============================
# JWT Configuration
# ===============================
jwt.secret=mySecretKey12345678901234567890123456789012345678901234567890
jwt.expiration=900000

# ===============================
# Google OAuth2 Configuration
# ===============================
google.client.id=313010278557-qdf70pdnj7q821uan3cii0m9jl02qr8h.apps.googleusercontent.com

# ===============================
# Kafka Producer Configuration
# ===============================
spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer



# Topic name (inject in producer code)
spring.kafka.topic.name=userEvents

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.org.apache.kafka=DEBUG
logging.level.org.springframework.kafka=DEBUG

# ===============================
# Tracing (Zipkin)
# ===============================
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.tracing.sampling.probability=1.0
management.observations.key-values.repository.type=all

# ===============================
# Resilience4j Circuit Breaker
# ===============================
# How many calls to monitor (the 'sliding window')
resilience4j.circuitbreaker.instances.userService.sliding-window-size=10

# Trip the circuit if 50% of those 10 calls fail
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50

# After tripping, wait 30 seconds before trying again (Half-Open state)
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=30s

# Allow 3 'test' calls when in Half-Open state to see if it's fixed
resilience4j.circuitbreaker.instances.userService.permitted-number-of-calls-in-half-open-state=3

# Kafka Producer Circuit Breaker
resilience4j.circuitbreaker.instances.kafkaProducer.sliding-window-size=10
resilience4j.circuitbreaker.instances.kafkaProducer.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.kafkaProducer.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.kafkaProducer.permitted-number-of-calls-in-half-open-state=3
