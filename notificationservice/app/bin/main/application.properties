server.port=8084
spring.application.name=notification-service

spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=cabit-notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

jwt.secret=mySecretKey12345678901234567890123456789012345678901234567890

# Add this to NotificationService application.properties
spring.kafka.consumer.properties.spring.json.type.mapping=RideCreatedEvent:org.example.kafka.events.RideCreatedEvent,RideJoinedEvent:org.example.kafka.events.RideJoinedEvent,RideLeftEvent:org.example.kafka.events.RideLeftEvent

# ===============================
# Tracing (Zipkin)
# ===============================
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.tracing.sampling.probability=1.0
management.observations.key-values.repository.type=all