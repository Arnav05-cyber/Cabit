plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.1'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.cabit'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    /* ================= CORE SPRING ================= */
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    /* ================= VALIDATION ================= */
    implementation 'org.springframework.boot:spring-boot-starter-validation'


    /* ================= DATABASE ================= */
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    /* ================= SECURITY ================= */
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'      // You have 'implementation', not 'runtimeOnly'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'   // You have 'implementation', not 'runtimeOnly'

    // JWT (match this with your Auth Service)
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    /* ================= KAFKA ================= */
    implementation 'org.springframework.kafka:spring-kafka'

    /* ================= SERVICE COMMUNICATION ================= */
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.1.0'

    /* ================= REDIS ================= */
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    /*==================WebClient==================*/
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    /* ================= UTILITIES ================= */
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    /* ================= TESTING ================= */
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'

    /* ================= TRACING ================= */
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
    implementation 'io.micrometer:micrometer-observation'
}

tasks.named('test') {
    useJUnitPlatform()
}
