jwt.secret=mySecretKey12345678901234567890123456789012345678901234567890

spring.profiles.active=local
openrouteservice.api.url=https://api.openrouteservice.org
nominatim.api.url=https://nominatim.openstreetmap.org
spring.datasource.url=jdbc:mysql://mysql:3306/cabit
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=ride-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.data.redis.host=redis
spring.data.redis.port=6379

# Add this to RideService application.properties
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer