jwt.secret=mySecretKey12345678901234567890123456789012345678901234567890

spring.profiles.active=local
openrouteservice.api.url=https://api.openrouteservice.org
nominatim.api.url=https://nominatim.openstreetmap.org
spring.datasource.url=jdbc:mysql://mysql:3306/cabit
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=ride-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.data.redis.host=redis
spring.data.redis.port=6379

# Add this to RideService application.properties
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ===============================
# Tracing (Zipkin)
# ===============================
spring.application.name=ride-service
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.tracing.sampling.probability=1.0
management.observations.key-values.repository.type=all

# ===============================
# Resilience4j Circuit Breaker
# ===============================
# How many calls to monitor (the 'sliding window')
resilience4j.circuitbreaker.instances.userService.sliding-window-size=10

# Trip the circuit if 50% of those 10 calls fail
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50

# After tripping, wait 30 seconds before trying again (Half-Open state)
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=30s

# Allow 3 'test' calls when in Half-Open state to see if it's fixed
resilience4j.circuitbreaker.instances.userService.permitted-number-of-calls-in-half-open-state=3